services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    platform: linux/arm64
    container_name: edgemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edgemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgemind123}
      POSTGRES_DB: ${POSTGRES_DB:-edgemind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edgemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edgemind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: shnabeelanwar/edgemind:backend-3.0.0
    platform: linux/arm64
    container_name: edgemind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-edgemind}:${POSTGRES_PASSWORD:-edgemind123}@postgres:5432/${POSTGRES_DB:-edgemind}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      ORCHESTRATOR_URL: https://edgemind-orchestrator.infra-ad9.workers.dev
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - uploads:/app/uploads
      - models:/models
      #- ./EdgeMind_backend/prisma:/app/prisma
    networks:
      - edgemind-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (React + Nginx)
  frontend:
    image: shnabeelanwar/edgemind:frontend-3.0.0
    platform: linux/arm64
    container_name: edgemind-frontend
    restart: unless-stopped
    depends_on:
      - backend
      # - inference-proxy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - edgemind-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # YOLO Inference API
  yolo-api:
    image: shnabeelanwar/hailo-infer:1.4.0
    platform: linux/arm64
    container_name: edgemind-yolo-api
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
      - /dev/hailo0:/dev/hailo0
    restart: unless-stopped
    environment:
      YOLO_MODEL: yolov8n.pt
      ENABLE_CORS: "true"
      CORS_ORIGINS: "*"
    ports:
      - "${YOLO_API_PORT:-8000}:8000"
    volumes:
      - models:/models
     
    networks:
      - edgemind-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  edgemind-network:
    driver: bridge
    name: edgemind-network

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
  models:
    driver: local
